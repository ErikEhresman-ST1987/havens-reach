<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081018">
  <title>Haven's Reach</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="station-arrival-visuals.css">
  <link rel="stylesheet" href="travel-map.css">
  <link rel="stylesheet" href="commodity-icons.css">
  <link rel="stylesheet" href="npc-visual-identity.css">
  <link rel="stylesheet" href="transient-field-site.css">
  <link rel="stylesheet" href="phone-layout.css">
  <link rel="stylesheet" href="log-quick-access.css">
  <link rel="stylesheet" href="field-network.css">
  <link rel="stylesheet" href="station-project-clarity.css">
  <link rel="stylesheet" href="captains-briefing.css">
  <link rel="stylesheet" href="operator-customization.css">
  <link rel="stylesheet" href="npc-population.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">INDEPENDENT OPERATOR CONSOLE</p>
      <h1>Haven's Reach</h1>
    </div>
    <button id="resetButton" class="danger secondary">New Game</button>
  </header>

  <main class="app-shell">
    <section class="status-grid" aria-label="Ship status">
      <div class="status-card"><span>Credits</span><strong id="credits">0</strong></div>
      <div class="status-card"><span>Fuel</span><strong id="fuel">0 / 0</strong></div>
      <div class="status-card"><span>Hull</span><strong id="hull">0%</strong></div>
      <div class="status-card"><span>Cargo</span><strong id="cargoUsed">0 / 0</strong></div>
    </section>

    <section class="panel hero-panel">
      <div>
        <p class="eyebrow">CURRENT LOCATION</p>
        <h2 id="locationName"></h2>
        <p id="locationDescription" class="muted"></p>
      </div>
      <div class="ship-card">
        <span class="ship-mark" aria-hidden="true">◇</span>
        <div>
          <strong id="shipName"></strong>
          <p id="shipDetails" class="muted small"></p>
        </div>
      </div>
    </section>

    <nav class="tabs" aria-label="Operator sections">
      <button class="tab active" data-view="overview">Station</button>
      <button class="tab" data-view="market">Market</button>
      <button class="tab" data-view="contracts">Contracts</button>
      <button class="tab" data-view="travel">Travel</button>
      <button class="tab" data-view="ship">Ship</button>
    </nav>

    <section id="view" class="panel view-panel" aria-live="polite"></section>

    <section class="panel log-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CAPTAIN'S LOG</p>
          <h2>Recent Events</h2>
        </div>
      </div>
      <div id="eventLog" class="event-log"></div>
    </section>
  </main>

  <dialog id="encounterDialog">
    <form method="dialog" class="encounter-card">
      <p class="eyebrow">OPERATOR ENCOUNTER</p>
      <h2 id="encounterTitle"></h2>
      <p id="encounterText"></p>
      <div id="encounterChoices" class="button-stack"></div>
    </form>
  </dialog>

  <script src="game-data.js"></script>
  <script src="captains-briefing.js"></script>
  <script src="app.js"></script>
  <script src="ship-upgrades.js"></script>
  <script src="market-memory.js"></script>
  <script src="contract-refresh.js"></script>
  <script src="richer-encounters.js"></script>
  <script src="npc-persistence.js"></script>
  <script src="cantina-rumors.js"></script>
  <script src="frontier-expansion.js"></script>
  <script src="frontier-identity.js"></script>
  <script src="career-contracts.js"></script>
  <script src="station-repairs.js"></script>
  <script src="mission-depth.js"></script>
  <script src="progressive-discovery.js"></script>
  <script src="dynamic-markets.js"></script>
  <script src="npc-opportunities.js"></script>
  <script src="trade-readability.js"></script>
  <script src="npc-opportunity-signals.js"></script>
  <script src="smuggling-contracts.js"></script>
  <script src="station-identity.js"></script>
  <script src="ship-chassis.js"></script>
  <script src="seli-private-freight.js"></script>
  <script src="contract-variety.js"></script>
  <script src="content-depth.js"></script>
  <script src="draak-freight-retrofit.js"></script>
  <script src="contact-visibility.js"></script>
  <script src="station-arrival-visuals.js"></script>
  <script src="travel-map.js"></script>
  <script src="commodity-icons.js"></script>
  <script src="npc-visual-identity.js"></script>
  <script src="transient-field-site.js"></script>
  <script src="transient-field-arrival.js"></script>
  <script src="log-quick-access.js"></script>
  <script src="field-network.js"></script>
  <script src="field-network-compat.js"></script>
  <script src="field-network-renewal.js"></script>
  <script src="haven-station-project.js"></script>
  <script src="wayfarer-refit.js"></script>
  <script src="station-project-clarity.js"></script>
  <script src="operator-customization.js"></script>
  <script src="npc-population.js"></script>
  <script src="seli-conversations.js"></script>
  <script src="contact-visit-cap.js"></script>
  <script src="contact-conversations-expanded.js"></script>
  <script src="recurring-npc-conversations.js"></script>
  <script src="contact-caught-up-state.js"></script>
  <script src="meridian-trade-berth.js"></script>
  <script src="prospect-frontier-service-dock.js"></script>
</body>
</html>
