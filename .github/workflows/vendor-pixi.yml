name: Vendor PixiJS 8.21.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-pixi.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned production build
        run: |
          mkdir -p vendor
          curl --fail --location --silent --show-error https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js --output vendor/pixi.min.js
          test -s vendor/pixi.min.js
      - name: Commit vendored runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/pixi.min.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor PixiJS 8.21.0 production runtime"
          git push
